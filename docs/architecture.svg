<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <style>
    .box { fill:#f7f8fa; stroke:#263238; stroke-width:2; rx:14; }
    .title { font:700 22px Arial; fill:#17212b; }
    .text { font:16px Arial; fill:#263238; }
    .small { font:14px Arial; fill:#455a64; }
    .arrow { stroke:#37474f; stroke-width:3; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#37474f"/>
    </marker>
  </defs>

  <text x="600" y="42" text-anchor="middle" class="title">Production Visual Defect Detection Architecture</text>

  <rect x="50" y="90" width="220" height="120" class="box"/>
  <text x="160" y="125" text-anchor="middle" class="title">Factory Images</text>
  <text x="160" y="155" text-anchor="middle" class="text">Normal / Defective</text>
  <text x="160" y="181" text-anchor="middle" class="small">Camera → dataset</text>

  <rect x="340" y="90" width="220" height="120" class="box"/>
  <text x="450" y="125" text-anchor="middle" class="title">Data Pipeline</text>
  <text x="450" y="155" text-anchor="middle" class="text">Validate + dedupe</text>
  <text x="450" y="181" text-anchor="middle" class="small">Stratified 70/15/15 split</text>

  <rect x="630" y="90" width="220" height="120" class="box"/>
  <text x="740" y="125" text-anchor="middle" class="title">Training</text>
  <text x="740" y="155" text-anchor="middle" class="text">EfficientNet-B0</text>
  <text x="740" y="181" text-anchor="middle" class="small">Transfer learning + augmentation</text>

  <rect x="920" y="90" width="220" height="120" class="box"/>
  <text x="1030" y="125" text-anchor="middle" class="title">Evaluation</text>
  <text x="1030" y="155" text-anchor="middle" class="text">Precision / Recall / F1</text>
  <text x="1030" y="181" text-anchor="middle" class="small">Confusion matrix + errors</text>

  <line x1="270" y1="150" x2="340" y2="150" class="arrow"/>
  <line x1="560" y1="150" x2="630" y2="150" class="arrow"/>
  <line x1="850" y1="150" x2="920" y2="150" class="arrow"/>

  <rect x="200" y="340" width="260" height="130" class="box"/>
  <text x="330" y="375" text-anchor="middle" class="title">Model Artifact</text>
  <text x="330" y="405" text-anchor="middle" class="text">best_model.pt</text>
  <text x="330" y="433" text-anchor="middle" class="small">Versioned checkpoint</text>

  <rect x="590" y="340" width="260" height="130" class="box"/>
  <text x="720" y="375" text-anchor="middle" class="title">FastAPI Service</text>
  <text x="720" y="405" text-anchor="middle" class="text">POST /predict</text>
  <text x="720" y="433" text-anchor="middle" class="small">Validation + logging + latency</text>

  <rect x="980" y="340" width="170" height="130" class="box"/>
  <text x="1065" y="375" text-anchor="middle" class="title">Client</text>
  <text x="1065" y="405" text-anchor="middle" class="text">Image</text>
  <text x="1065" y="433" text-anchor="middle" class="small">JSON result</text>

  <line x1="740" y1="210" x2="330" y2="340" class="arrow"/>
  <line x1="460" y1="405" x2="590" y2="405" class="arrow"/>
  <line x1="850" y1="405" x2="980" y2="405" class="arrow"/>

  <rect x="420" y="525" width="360" height="60" class="box"/>
  <text x="600" y="562" text-anchor="middle" class="text">Docker → reproducible deployment</text>
</svg>
